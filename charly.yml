# charly.yml — unified project root for the firecracker host layer.
#
#   box/<name>/charly.yml   — one image per directory
#   candy/<name>/charly.yml — one layer (candy) per directory
#
# Both directories are DISCOVERED, so the candy below is gated by `charly box validate` and by the
# beds. The default distro/builder/init vocabulary is EMBEDDED in the charly binary; `defaults:` here
# only extends it.

discover:
  - path: box
    recursive: true
  - path: candy
    recursive: true

defaults:
  registry: ghcr.io/opencharly
  tag: auto
  platform:
    - linux/amd64
  build: [rpm]

# =============================================================================
# firecracker-host-app — the HOST posture recipe.
#
# The candy installs the ARTEFACTS (the pinned VMM + jailer, the fireactions kernel); this template
# adds the posture a microVM needs from the MACHINE it runs on, and it is a host template because that
# is what the posture is: udev rules, sysctls and packet-filter rules have no meaning inside an image
# build, and applying them to an operator's workstation uninvited is exactly what this repo must never
# do. A deploy of this template IS the deliberate act.
#
# Everything here is IDEMPOTENT (re-running changes nothing) and SELF-GATING (a target without KVM or
# without systemd says so and skips, rather than installing a rule that can never apply).
# =============================================================================
firecracker-host-app:
    local:
        candy:
            - layer-firecracker
        install_opts:
            # The posture is root-scoped by nature: /etc/udev, /etc/sysctl.d and the packet filter.
            allow_root_tasks: true
        description: |-
            The firecracker host posture: the pinned VMM and kernel (from layer-firecracker), then
            group-based access to /dev/kvm instead of a world-writable device, IP forwarding, and the
            NAT/FORWARD rules a TAP-backed guest needs to reach the network.
        plan:
            - run: create the kvm group and give the VMM's account access to /dev/kvm — NOT 0666
              id: firecracker-kvm-access
              command: |
                set -eu
                # Self-gating: nothing to fix on a target with no KVM, and the reason is printed rather
                # than a rule that can never apply.
                if [ ! -e /dev/kvm ]; then
                  echo "no /dev/kvm on this target: skipping the kvm access posture"
                  exit 0
                fi
                getent group kvm >/dev/null 2>&1 || groupadd --system kvm
                if [ -n "${FC_VMM_USER:-}" ] && [ "${FC_VMM_USER}" != root ] && id "${FC_VMM_USER}" >/dev/null 2>&1; then
                  usermod -aG kvm "${FC_VMM_USER}"
                fi
                if command -v udevadm >/dev/null 2>&1; then
                  udevadm control --reload-rules
                  udevadm trigger --name-match=kvm
                fi
              run_as: root
            - run: write the udev rule that grants the kvm group access without opening the device to the world
              id: firecracker-kvm-udev-rule
              write: /etc/udev/rules.d/60-charly-firecracker.rules
              mode: "0644"
              run_as: root
              content: |
                # Written by charly's layer-firecracker.
                #
                # NOT 0666. A world-writable /dev/kvm lets ANY local process reach every guest's memory
                # and the host kernel through it — the posture this layer replaces. Group access is
                # enough: the account that runs the VMM is added to `kvm` by the deploy.
                KERNEL=="kvm", GROUP="kvm", MODE="0660"
            - run: enable IP forwarding on the target that hosts microVMs
              id: firecracker-ip-forward
              write: /etc/sysctl.d/60-charly-firecracker.conf
              mode: "0644"
              run_as: root
              content: |
                # A TAP-backed guest is a ROUTER's neighbour: without forwarding the host cannot pass a
                # packet between the guest and the uplink, and the guest boots into a network it cannot
                # reach. Measured on the host that filed this integration's WI-6: the forwarding POLICY
                # was DROP while ip_forward was already 1 — so both are set here, and both are asserted.
                net.ipv4.ip_forward = 1
            - run: apply the sysctl now, not only at the next boot
              id: firecracker-ip-forward-apply
              command: |
                set -eu
                if command -v sysctl >/dev/null 2>&1; then
                  sysctl -q -w net.ipv4.ip_forward=1
                fi
              run_as: root
            - check: /dev/kvm is group-accessible and NOT world-writable
              id: firecracker-kvm-mode
              command: |
                set -eu
                if [ ! -e /dev/kvm ]; then
                  echo "no /dev/kvm on this target — the posture cannot be asserted here"
                  exit 0
                fi
                MODE=$(stat -c '%a' /dev/kvm)
                [ "$MODE" != "666" ] || { echo "/dev/kvm is world-writable ($MODE)"; exit 1; }
                case "$MODE" in
                  6[0-9][0-9]|6[0-7]0) ;;
                  *) echo "/dev/kvm mode $MODE does not grant the owning group access"; exit 1 ;;
                esac
              context: [deploy]
            - check: IP forwarding is on
              id: firecracker-ip-forward-on
              command: |
                set -eu
                [ "$(cat /proc/sys/net/ipv4/ip_forward)" = "1" ]
              context: [deploy]

# =============================================================================
# check-firecracker-vm — the disposable guest the posture bed runs INSIDE.
#
# Nesting is the point: the posture must never be applied to an operator's workstation by a bed, and a
# nested `local:` deploy confines every write to this guest (the canonical pattern — see
# box/arch's check-arch-vm → arch-host). The guest needs its OWN /dev/kvm for the posture to mean
# anything, which is why the CPU mode matters: the renderer defaults to `host-passthrough`, and the
# host enables nested KVM, so a microVM can be run inside this disposable VM.
# =============================================================================
check-firecracker-vm:
    vm:
        source:
            # The rolling Arch cloud image: the dated pkgbuild paths rotate away (opencharly/charly#826),
            # so the live spelling is used and the checksum block goes with the date.
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo

# =============================================================================
# check-firecracker-posture — the R10 bed for the host posture.
#
# A disposable VM boots, and a NESTED `local:` member applies the posture template INSIDE it: the VMM
# and kernel are installed, /dev/kvm is moved from whatever the image shipped to group-only access,
# forwarding is enabled, and the checks assert the resulting state. The operator's workstation is
# never touched — which is the whole reason this bed is a VM and not a `host: local` deploy.
#
# What it does NOT yet prove, stated rather than implied: `mode: cni` (the pinned tc-redirect-tap
# plugin + the conflist) and a BOOTED microVM inside the guest. Both are their own slices.
# =============================================================================
check-firecracker-posture:
    vm:
        from: check-firecracker-vm
        disposable: true
        lifecycle: dev
        description: >-
            The firecracker host posture on a disposable guest: layer-firecracker installs the pinned
            VMM + jailer and the fireactions kernel, the posture template grants group-only access to
            /dev/kvm, enables IP forwarding and writes the sysctl drop-in, and the plan asserts the
            device mode and the forwarding state on the RUNNING guest. Nested on purpose: a posture
            bed must never write to the operator's workstation.
        check-firecracker-posture-member:
            local:
                from: firecracker-host-app
