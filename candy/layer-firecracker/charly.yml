layer-firecracker:
    candy:
        description: |-
            The Firecracker microVM HOST layer: the pinned VMM (`firecracker` + its `jailer`), the
            KERNEL artefact the pools boot, and — in the same candy — the host posture a microVM
            needs. Every artefact is pinned and every pin is ASSERTED, so a substituted or truncated
            binary fails at check time rather than at boot.

            Why the pins are what they are:
            - The VMM is `firecracker` v1.17.0 from the upstream release. Firecracker boots a guest
              with NO libvirt, no domain and no host arbiter lease, which is exactly why the
              substrate reuses the "ssh" venue without claiming an exclusive one (ledger WI-4).
            - The KERNEL comes from Firecracker's own distribution channel
              (`storage.googleapis.com/fireactions/kernels/<arch>/<ver>/vmlinux`) at the version the
              FIRECACTIONS pools pin — ONE canonical kernel for the layer and the pools, never two
              (R2). It is an uncompressed ELF `vmlinux`, NOT a distro `bzImage`: the VMM loads it
              directly, so a bzImage is a boot that dies before the first instruction. The check
              below asserts the ELF magic for exactly that reason.
            - Both are verified by sha256 against values measured from the real upstream artefacts.
              The download verb's cache is content-addressed by URL, which is a CACHE key and not an
              integrity pin — so the pin is asserted here, in the product.

            THE HOST POSTURE (a `kvm` group or ACL on /dev/kvm rather than a world-writable 0666, the
            TAP device, forwarding/NAT, `ip_forward`, and the `mode: cni` conflist + `tc-redirect-tap`)
            is root-scoped work that a container image cannot own: it belongs to the `kind: local`
            template + deploy in this repo's root manifest, where it is applied idempotently and
            self-gates on the target's own state.
        var:
            # The VMM release. `x86_64` is the tarball's own arch word (NOT ${ARCH}'s `amd64`) —
            # Firecracker's release channel uses the uname spelling, so it is hardcoded rather than
            # faked from a build arg. aarch64 is a separate artefact and not claimed here.
            FC_VERSION: v1.17.0
            FC_RELEASE_SHA256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
            FC_BINARY_SHA256: 99ad0f5cd0514a88aad0e9ae8cfdb3cc3b4ab9d190e1194602406c786b5de7a5
            JAILER_BINARY_SHA256: 65ef226e96f0ceda55ba643f445801ef2cc0ea667ef67cad8ac4f406c9c8434f
            # The kernel the fireactions pools boot. `amd64` here IS the fireactions channel's own
            # arch word.
            FC_KERNEL_VERSION: "5.10"
            FC_KERNEL_ARCH: amd64
            FC_KERNEL_SHA256: 298055d97266f3dcf8ef30ca195c45a1d15f482f74ea8a035a5ee417533c76b0
            FC_KERNEL_DIR: /var/lib/firecracker/kernels
            FC_PREFIX: /opt/firecracker
            FC_TARBALL: /var/cache/charly/firecracker/firecracker-v1.17.0-x86_64.tgz
        plan:
            - run: download the pinned VMM release tarball (fetched, not extracted — see the unpack step)
              id: firecracker-release
              download: "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
              extract: none
              to: "${FC_TARBALL}"
              mode: "0644"
              run_as: root
            - run: unpack the pinned release beside itself, WITHOUT honouring upstream ownership
              id: firecracker-release-unpack
              command: |
                set -eu
                # --no-same-owner is the MECHANISM fix, not a convenience: the upstream tarball's
                # entries carry uid 14133424, which cannot be mapped inside the rootless build's user
                # namespace, so tar's chown attempt dies with EINVAL ("Cannot change ownership to uid
                # 14133424 … Invalid argument") and takes the build with it. The upstream ownership is
                # meaningless to us — the two binaries we keep are installed onto PATH below, and
                # everything else in the archive is reference material — so it is not honoured.
                mkdir -p "${FC_PREFIX}"
                tar --no-same-owner -xzf "${FC_TARBALL}" -C "${FC_PREFIX}"
              run_as: root
            - run: install the VMM and its jailer onto PATH from the pinned release
              id: firecracker-binaries
              command: |
                set -eu
                REL="${FC_PREFIX}/release-${FC_VERSION}-x86_64"
                install -m 0755 "${REL}/firecracker-${FC_VERSION}-x86_64" /usr/local/bin/firecracker
                install -m 0755 "${REL}/jailer-${FC_VERSION}-x86_64" /usr/local/bin/jailer
              run_as: root
            - run: install the kernel artefact the pools boot, at the pools' own pinned version
              id: firecracker-kernel
              download: "https://storage.googleapis.com/fireactions/kernels/${FC_KERNEL_ARCH}/${FC_KERNEL_VERSION}/vmlinux"
              to: "${FC_KERNEL_DIR}/${FC_KERNEL_VERSION}/vmlinux"
              mode: "0644"
              run_as: root
            - check: the installed VMM and jailer are the PINNED builds, byte for byte
              id: firecracker-binaries-pinned
              command: |
                set -eu
                printf '%s  %s\n' "${FC_BINARY_SHA256}" /usr/local/bin/firecracker | sha256sum -c -
                printf '%s  %s\n' "${JAILER_BINARY_SHA256}" /usr/local/bin/jailer | sha256sum -c -
            - check: the VMM answers --version with the pinned version
              id: firecracker-version
              command: |
                set -eu
                firecracker --version | grep -q "${FC_VERSION#v}"
              exit_status: 0
            - check: the kernel artefact is the PINNED one and is the uncompressed ELF the VMM boots (never a distro bzImage)
              id: firecracker-kernel-pinned
              command: |
                set -eu
                K="${FC_KERNEL_DIR}/${FC_KERNEL_VERSION}/vmlinux"
                printf '%s  %s\n' "${FC_KERNEL_SHA256}" "${K}" | sha256sum -c -
                # The ELF magic, read with nothing but coreutils: a bzImage would fail here, and a
                # bzImage is a guest that never reaches its first instruction.
                [ "$(head -c 4 "${K}" | tail -c 3)" = "ELF" ]
              exit_status: 0
